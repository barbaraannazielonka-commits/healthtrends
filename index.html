<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hype Check: 30 health trends from your feed</title>
<meta name="description" content="30 health trends from social media, checked against sources from 2024 to 2026. Includes a pitfalls page and a full sources page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F5FC; --surface:#FFFFFF; --ink:#11173A; --ink2:#454C75; --line:#D5DAEF;
  --accent:#3347FF; --accent-ink:#FFFFFF; --focus:#3347FF;
  --c-food:#E8691A; --c-mind:#6F4EF5; --c-move:#0E9A76; --c-look:#E03A78; --c-tech:#2564F0;
  --solid-bg:#C9F3E3; --solid-fg:#07523B; --solid-bd:#0E9A76;
  --mixed-bg:#FFEAA6; --mixed-fg:#5C4300; --mixed-bd:#C99700;
  --weak-bg:#FFD9BC; --weak-fg:#6B2E00; --weak-bd:#D9701A;
  --risky-bg:#FFC8D5; --risky-fg:#7A0827; --risky-bd:#D6264F;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1230; --surface:#171C47; --ink:#EEF0FF; --ink2:#B4BAE8; --line:#2C3370;
    --accent:#93A3FF; --accent-ink:#0E1230; --focus:#93A3FF;
    --c-food:#FF9248; --c-mind:#A08BFF; --c-move:#2ED3A2; --c-look:#FF6B9F; --c-tech:#6C9BFF;
    --solid-bg:#0F4A3A; --solid-fg:#C4F6E4; --solid-bd:#2ED3A2;
    --mixed-bg:#4D3C00; --mixed-fg:#FFE79A; --mixed-bd:#F2C230;
    --weak-bg:#5A2A08; --weak-fg:#FFD6B6; --weak-bd:#FF9A4D;
    --risky-bg:#5E1226; --risky-fg:#FFCDD9; --risky-bd:#FF6B8E;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1230; --surface:#171C47; --ink:#EEF0FF; --ink2:#B4BAE8; --line:#2C3370;
  --accent:#93A3FF; --accent-ink:#0E1230; --focus:#93A3FF;
  --c-food:#FF9248; --c-mind:#A08BFF; --c-move:#2ED3A2; --c-look:#FF6B9F; --c-tech:#6C9BFF;
  --solid-bg:#0F4A3A; --solid-fg:#C4F6E4; --solid-bd:#2ED3A2;
  --mixed-bg:#4D3C00; --mixed-fg:#FFE79A; --mixed-bd:#F2C230;
  --weak-bg:#5A2A08; --weak-fg:#FFD6B6; --weak-bd:#FF9A4D;
  --risky-bg:#5E1226; --risky-fg:#FFCDD9; --risky-bd:#FF6B8E;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.125rem;line-height:1.6}
a{color:var(--accent)}
img,svg{max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;z-index:100}
.skip:focus{left:12px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:64px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.logo{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-mark{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid var(--solid-bd);background:var(--solid-bg);color:var(--solid-fg);border-radius:8px;transform:rotate(-6deg)}
nav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
nav a.nl{font-family:var(--display);font-weight:700;font-size:1rem;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:999px;border:2px solid transparent}
nav a.nl:hover{border-color:var(--line)}
nav a.nl[aria-current="page"]{background:var(--ink);color:var(--paper)}
.theme{font-family:var(--display);font-weight:700;font-size:.95rem;background:transparent;color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.theme:hover{border-color:var(--ink)}
.theme[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* stamps */
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.01em;line-height:1;padding:5px 11px 5px 8px;border-radius:6px;border:2px solid var(--vbd);background:var(--vbg);color:var(--vfg);transform:rotate(-2deg);white-space:nowrap}
.stamp svg{width:16px;height:16px;flex:none}
.stamp.big{font-size:1.15rem;padding:8px 16px 8px 12px;border-width:3px}
.stamp.big svg{width:22px;height:22px}
.v-solid{--vbg:var(--solid-bg);--vfg:var(--solid-fg);--vbd:var(--solid-bd)}
.v-mixed{--vbg:var(--mixed-bg);--vfg:var(--mixed-fg);--vbd:var(--mixed-bd)}
.v-weak{--vbg:var(--weak-bg);--vfg:var(--weak-fg);--vbd:var(--weak-bd)}
.v-risky{--vbg:var(--risky-bg);--vfg:var(--risky-fg);--vbd:var(--risky-bd)}

/* hero */
.hero{padding:44px 0 28px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:start}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,6.2vw,4.9rem);line-height:1.02;letter-spacing:-.03em;margin:0 0 20px}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--mixed-bg) 62%);padding:0 .08em}
.hero p.lead{font-size:1.3rem;max-width:34em;margin:0 0 24px;color:var(--ink2)}
.btnrow{display:flex;gap:12px;flex-wrap:wrap}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;text-decoration:none;padding:12px 22px;border-radius:10px;border:2px solid var(--ink);display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.legend{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:20px 22px}
.legend h2{font-family:var(--display);font-size:1.1rem;margin:0 0 14px;font-weight:800}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.legend li{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;font-size:1rem;line-height:1.4}
.legend .stamp{justify-self:start}
@keyframes stampIn{0%{opacity:0;transform:scale(1.7) rotate(-9deg)}60%{opacity:1;transform:scale(.96) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
.legend li:nth-child(1) .stamp{animation:stampIn .45s .15s both}
.legend li:nth-child(2) .stamp{animation:stampIn .45s .40s both}
.legend li:nth-child(3) .stamp{animation:stampIn .45s .65s both}
.legend li:nth-child(4) .stamp{animation:stampIn .45s .90s both}
@media (prefers-reduced-motion: reduce){.legend .stamp{animation:none!important}.btn:hover{transform:none}}

.why{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:18px 0;margin:10px 0 34px}
.why p{margin:0;max-width:56em;font-size:1.1rem}
.why strong{font-family:var(--display);font-weight:800}

/* controls */
.controls{display:grid;gap:14px;margin-bottom:22px}
.ctl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctl-label{font-family:var(--display);font-weight:700;font-size:.95rem;margin-right:6px;color:var(--ink2)}
.chip{font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--dot,var(--ink));flex:none}
.search{font-family:var(--body);font-size:1.05rem;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:min(100%,320px)}
.search:focus{border-color:var(--accent)}
.count{font-family:var(--display);font-weight:700;color:var(--ink2);margin:0}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;list-style:none;margin:0;padding:0}
.card{display:flex;flex-direction:column;gap:10px;height:100%;background:var(--surface);color:var(--ink);text-decoration:none;border:2px solid var(--line);border-left:10px solid var(--cat);border-radius:12px;padding:16px 16px 14px 16px}
.card:hover{border-color:var(--ink);border-left-color:var(--cat)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cat-label{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--ink2)}
.card-name{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.15;letter-spacing:-.01em}
.card-hook{font-size:1.02rem;line-height:1.45;color:var(--ink2);flex:1}
.card-foot{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--ink2)}
.empty{padding:40px 0;font-family:var(--display);font-weight:700;font-size:1.2rem}


/* hover preview */
.cell{position:relative}
.cell .card{position:relative}
.peek{position:absolute;left:-4px;right:-4px;top:-4px;min-height:calc(100% + 8px);z-index:6;display:none;flex-direction:column;gap:6px;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-left:12px solid var(--cat);border-radius:14px;padding:14px 16px;box-shadow:0 14px 30px rgba(10,14,50,.28);pointer-events:none}
.peek-name{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.15}
.peek-h{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--ink2);margin-top:4px}
.peek-t{font-size:.98rem;line-height:1.45}
.peek-v{display:block;margin:2px 0}
.peek-go{font-family:var(--display);font-weight:800;font-size:.9rem;color:var(--accent);margin-top:6px}
@media (hover:hover){
  .cell:hover{z-index:7}
  .cell:hover .peek{display:flex}
}
.cell:focus-within{z-index:7}
.cell:focus-within .peek{display:flex}
@media (hover:none){.peek{display:none!important}}

/* dialog */
dialog{border:3px solid var(--ink);border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto}
dialog::backdrop{background:rgba(8,12,38,.65)}
.dlg-band{height:14px;background:var(--cat)}
.dlg-in{padding:22px 26px 30px}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:6px}
.dlg-cat{font-family:var(--display);font-weight:700;color:var(--ink2);margin:0 0 4px}
.dlg h2,dialog h2{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 14px}
.close{font-family:var(--display);font-weight:700;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:8px 16px;cursor:pointer;flex:none}
.seen{font-family:var(--display);font-weight:700;font-size:1.05rem;background:var(--paper);border-left:6px solid var(--cat);padding:12px 16px;border-radius:0 10px 10px 0;margin:0 0 18px}
.seen span{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:2px}
dialog h3{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:22px 0 8px}
dialog p{margin:0 0 10px}
dialog ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
dialog li{position:relative;padding-left:22px}
dialog li::before{content:"";position:absolute;left:0;top:.6em;width:10px;height:10px;background:var(--cat);border-radius:2px}
.watch{background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:12px 16px}
.fine{font-size:.95rem;color:var(--ink2);margin-top:20px!important}
sup.refs{font-family:var(--display);font-size:.7rem;line-height:0;margin-left:3px;white-space:nowrap}
a.ref{display:inline-block;min-width:1.5em;text-align:center;padding:1px 4px;margin-left:2px;border-radius:5px;background:var(--paper);border:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:700}
a.ref:hover{border-color:var(--accent)}

/* inner pages */
.page{padding:40px 0 20px}
.page h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5.5vw,4rem);line-height:1.05;letter-spacing:-.03em;margin:0 0 16px}
.page .lead{font-size:1.25rem;color:var(--ink2);max-width:40em;margin:0 0 30px}
.page h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.1rem);letter-spacing:-.02em;line-height:1.1;margin:44px 0 16px}
.page h3{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0 0 6px;line-height:1.2}
.pgroup{border-top:2px solid var(--ink);padding-top:6px;margin-top:34px}
.pgroup > h2{margin-top:10px}
.pitems{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pitem{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:18px 20px}
.pitem p{margin:0 0 10px}
.seenin{font-family:var(--display);font-weight:700;font-size:.92rem;margin:0}
.seenin a{margin-right:10px;white-space:nowrap}
.rows{display:grid;gap:0;border:2px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.rows h3.vh{margin:0;padding:10px 16px;background:var(--ink);color:var(--paper);font-size:1rem}
.row{display:grid;grid-template-columns:minmax(150px,230px) 110px 1fr;gap:14px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{font-family:var(--display);font-weight:800;line-height:1.2}
.row .nm a{color:var(--ink)}
.row p{margin:0;font-size:1rem;line-height:1.5}
.checks{display:grid;gap:12px;counter-reset:q;padding:0;list-style:none;margin:0}
.checks li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px 18px}
.checks li::before{counter-increment:q;content:counter(q);font-family:var(--display);font-weight:800;font-size:1.4rem;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.checks b{font-family:var(--display);font-weight:800;display:block}
.callout{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:20px 24px;margin-top:30px}
.callout h2{margin:0 0 8px!important}
.callout p{margin:0 0 8px}

.method{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:6px 24px 14px}
.method ul{margin:10px 0 0;padding-left:1.2em;display:grid;gap:8px}
.srcgroup{margin-top:30px}
.srcgroup h2{margin:0 0 12px!important}
.srclist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.src{display:grid;grid-template-columns:48px 1fr;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 16px}
.src.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.src .n{font-family:var(--display);font-weight:800;font-size:1.1rem;width:40px;height:40px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center}
.src .t{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.3;word-break:break-word}
.src .m{font-size:.98rem;color:var(--ink2);margin:2px 0}
.src .u{font-size:.92rem;color:var(--ink2);margin:4px 0 0}
.src .u a{margin-right:8px;white-space:nowrap}
.src .nd{font-family:var(--display);font-weight:700;font-size:.8rem;background:var(--mixed-bg);color:var(--mixed-fg);border:1px solid var(--mixed-bd);padding:1px 8px;border-radius:5px;margin-left:6px}

footer{margin-top:60px;border-top:2px solid var(--ink);padding:24px 0 40px;font-size:1rem;color:var(--ink2)}
footer p{margin:0 0 6px;max-width:56em}

@media (max-width:860px){
  .hero-grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr;gap:6px}
  .row .stamp{justify-self:start}
}
@media (max-width:520px){
  body{font-size:1.06rem}
  .dlg-in{padding:18px 18px 26px}
  .legend li{grid-template-columns:96px 1fr}
}
</style>
</head>

{id:"fibermaxxing",name:"Fibermaxxing",cat:"food",v:"solid",
 hook:"Eat more fiber on purpose, at every meal.",
 what:"Fibermaxxing means choosing foods that are high in fiber all day. Think fruit, vegetables, whole grains, beans, nuts and seeds. [[2,4]]",
 ev:["A dietitian at University Hospitals calls it generally a positive trend because it pushes people to eat more fiber. [[2]]",
     "Researchers quoted by HealthDay say too little fiber can raise the risk of heart disease, diabetes and obesity. [[3]]",
     "HealthyWomen reports that about 9 in 10 women in the US do not reach the recommended daily amount of fiber. [[4]]",
     "A Cleveland Clinic podcast separates fact from hype and explains why most Americans get far too little fiber. [[1]]"],
 watch:"Add fiber slowly and drink enough water. Too much fiber too fast, without enough water, can cause hard stools and bloating. [[4]]",
 why:"Experts in all four sources see the basic idea as healthy."},

{id:"protein",name:"Protein on everything",cat:"food",v:"mixed",
 hook:"Protein coffee, protein popcorn and a protein goal at every meal.",
 what:"Online, the trend goes by names like protein maxxing. It means building meals around protein, often with help from fitness influencers. [[7]]",
 ev:["A University of Michigan poll of parents found that 40% of teens had used some kind of protein supplement in the past year. [[5]]",
     "A pediatric dietitian at Children's National Hospital says most teens already get enough protein without supplements. A common guide is about 1 gram per kilogram of body weight each day. [[5,6]]",
     "A pediatrician quoted by Science World says the biggest risk for teens is neglecting other nutrients when they focus too much on protein. [[6]]",
     "Experts quoted by Reporting Texas say most Americans already eat enough protein. [[7]]"],
 watch:"Science World says whole foods such as beans, eggs and dairy are a better source than powders. Some experts also link the trend to orthorexia, an unhealthy obsession with eating healthy. [[6,7]]",
 why:"Protein matters. The experts quoted say most teens already get enough, so more is not better."},

{id:"tallow",name:"Beef tallow and the seed oil panic",cat:"food",v:"weak",
 hook:"Seed oils are bad for you and beef fat is the fix.",
 what:"Influencers and some public figures promote beef tallow, which is rendered beef fat, as healthier than seed oils such as vegetable oil. Tallow skincare is trending too. [[8]]",
 ev:["A cardiologist told NPR that beef tallow and other saturated fats can lead to clogged arteries and high blood pressure. He added that seed oils have been unfairly blamed. [[8]]",
     "A dietitian at University Hospitals says there is very little long term research supporting beef tallow over other fats. [[9]]",
     "The same article notes that tallow contains monounsaturated fats with some heart health benefits, and that it also carries health risks. [[9]]"],
 watch:"One expert quoted by NPR says people pick tallow because it seems natural and comes from a farm. Judge a fat by the research on it. [[8]]",
 why:"The claim that tallow beats seed oils has little support in the sources."},

{id:"raw-milk",name:"Raw milk",cat:"food",v:"risky",
 hook:"Unpasteurized milk is more natural and better for you.",
 what:"Raw milk has not been heated to kill germs. The heating step is called pasteurization. [[10]]",
 ev:["A CDC review counted more than 200 outbreaks tied to raw milk between 1998 and 2018. More than 2,600 people got sick and 225 went to hospital. [[10]]",
     "A 2025 review article says the risks are clear and well established. It also says decades of research have found no evidence of health benefits. [[11]]",
     "According to Google Trends data cited in that review, searches for raw milk reached an all time high in February 2025. [[11]]"],
 watch:"Heating milk is the safety step. Skipping it adds risk with no proven benefit. [[10,11]]",
 why:"A CDC review and a 2025 article describe clear risks and no proven benefits."},

{id:"prebiotic-soda",name:"Prebiotic sodas",cat:"food",v:"mixed",
 hook:"A soda that is good for your gut.",
 what:"Prebiotic sodas such as Poppi add fiber that feeds gut bacteria, and they advertise gut health. [[12]]",
 ev:["A 2024 lawsuit claimed one brand's can had only about 2 grams of prebiotic fiber, too little for real benefits. [[12]]",
     "A Northeastern University professor says foods with prebiotics, such as fruit and vegetables, have strong evidence for supporting gut health. [[12]]",
     "The professor said it could be true that the sugar in these drinks outweighs any benefit, as the lawsuit claims. [[12]]"],
 watch:"A can does not replace fruit, vegetables and whole grains as a source of prebiotics. Check the label for fiber and sugar. [[12]]",
 why:"They may have less sugar than regular soda, and the gut benefits are still debated."},

{id:"electrolytes",name:"Electrolyte powders",cat:"food",v:"weak",
 hook:"Add a packet to your water for better hydration.",
 what:"Electrolyte powders such as Liquid I.V. have moved from sports into daily wellness. They add minerals called electrolytes to water. [[13]]",
 ev:["A hydration researcher told NPR that unless you sweat heavily for a long time or lose water fast through illness, you do not need extra electrolyte supplements. [[13]]",
     "If you eat a fairly balanced diet and are not an elite athlete or working in the sun all day, you most likely get the electrolytes you need from food. [[13]]",
     "Plain water, milk, soup, tea and water rich foods all help you rehydrate. [[13]]"],
 watch:"They can help after heavy sweating in the sun or during long runs. On most days, plain water does the job. [[13]]",
 why:"Useful in a few situations, unnecessary for most people on most days, according to the NPR report."},

{id:"energy-drinks",name:"Energy drinks",cat:"food",v:"risky",
 hook:"A can of Prime, Celsius or Bang to push through the day.",
 what:"Energy drinks are flavored drinks with caffeine. Influencers represent brands or sell their own drinks. [[14]]",
 ev:["Consumer Reports tested 17 energy drinks and 6 energy shots. Brands such as Bang, Celsius and Prime contained two to three times the recommended daily caffeine limit for people under 18. [[14]]",
     "Experts recommend that teens have no more than 100 mg of caffeine a day. [[14,15]]",
     "Texas Health Resources, citing the American Academy of Pediatrics, says one can of Prime Energy has 200 mg, double the daily limit for teens. [[15]]"],
 watch:"Caffeine can cause anxiety, jitteriness and stomach problems in teens. Check the milligrams on the label. [[15]]",
 why:"Common cans exceed the daily caffeine limit that experts set for teens."},

{id:"sleepmaxxing",name:"Sleepmaxxing",cat:"mind",v:"mixed",
 hook:"Trackers, supplements, gadgets and routines for perfect sleep.",
 what:"Sleepmaxxing is a catch all name for any tip, trick or gadget meant to help you fall asleep faster and sleep deeper. [[17]]",
 ev:["Sleep experts told National Geographic that the most effective methods are old ones that match basic sleep hygiene. [[17]]",
     "Research on magnesium and sleep quality is limited, and results for white noise devices are mixed. [[17]]",
     "Focusing too much on perfect sleep has a name, orthosomnia, and it can make it harder to sleep well. [[16,17]]"],
 watch:"Experts urge caution with extreme steps such as mouth taping and unregulated supplements. [[17]]",
 why:"Basic sleep habits have support. Many add ons do not."},

{id:"mouth-taping",name:"Mouth taping",cat:"mind",v:"risky",
 hook:"Tape your mouth shut at night to breathe through your nose.",
 what:"Mouth taping tries to stop mouth breathing during sleep, in the hope of less snoring and better rest. [[19]]",
 ev:["A 2025 review in PLOS One examined 10 studies. Only 2 suggested a benefit, for people with mild sleep apnea. [[19]]",
     "4 of the 10 studies warned of a serious risk of suffocation if mouth breathing comes from a blocked nose or airway. [[19]]",
     "A sleep specialist at Oregon Health and Science University said the studies are small, the benefits modest and the risks real. [[18]]",
     "Mouth breathing can be a sign of a condition such as obstructive sleep apnea. Doctors advise finding the cause. [[18]]"],
 watch:"If you often breathe through your mouth at night, talk to a doctor before you reach for tape. [[18]]",
 why:"Evidence of benefit is thin and the reviewed studies describe a serious risk for some people."},

{id:"cortisol",name:"The cortisol cocktail",cat:"mind",v:"weak",
 hook:"A mocktail that supposedly lowers your stress hormone.",
 what:"Cortisol is a hormone that rises during emotional or physical stress. The drink went viral with claims that it can bring cortisol down. [[20]]",
 ev:["Doctors told CNBC the drink is unlikely to lower cortisol and that good studies are missing. [[20]]",
     "One doctor said none of the ingredients alone is known to reduce stress, except maybe magnesium. [[20]]",
     "The drink might help you feel more hydrated, which most people could benefit from. [[20]]"],
 watch:"A doctor in the article says the focus should be on managing stress and what causes it. [[20]]",
 why:"The doctors in the CNBC report doubt the main claim."},

{id:"bed-rotting",name:"Bed rotting",cat:"mind",v:"mixed",
 hook:"Spend a whole day in bed on purpose as self care.",
 what:"Bed rotting means spending long periods in bed doing low energy things such as scrolling. There is no clinical definition of it. [[22]]",
 ev:["A GP reviewed article on Patient.info says a key warning sign is when bed rotting becomes a frequent habit and leaves you no more refreshed the next day. [[22]]",
     "The same article says to avoid it if it leads to difficulties sleeping. [[22]]",
     "Experts quoted by News On 6 say occasional bed rotting is not necessarily a problem, and that it can become one if it starts to interfere with daily life. [[58]]",
     "In a WBUR interview, psychiatrist Dr. Jessi Gold talks about how to draw the line between rest and depression. [[21]]"],
 watch:"Rest is healthy. If staying in bed becomes a pattern, take small steps back into your routine and talk to someone you trust. [[58]]",
 why:"Occasional rest is fine. A habit that does not leave you refreshed is a warning sign."},

{id:"dopamine-detox",name:"Dopamine detox",cat:"mind",v:"weak",
 hook:"Quit scrolling for a day to reset your brain.",
 what:"A dopamine detox means a break from quick rewards such as social media. A Cleveland Clinic psychologist explains that the idea grew from an older kind of psychological conditioning. [[23]]",
 ev:["The same psychologist says there is no such thing as a true dopamine detox, because we need dopamine to live. [[23]]",
     "She says low dopamine levels cause health problems, from chronic constipation to memory issues. [[23]]",
     "Her advice is to swap the habit you cut for another pleasant activity that is more soothing. [[23]]",
     "A psychologist at the University of Technology Sydney separates fact from hype in a November 2025 podcast. [[24]]"],
 watch:"The name is misleading, so look at what the plan asks you to do. Cutting back on scrolling and replacing it with a calmer activity is the safe version. [[23]]",
 why:"The brain reset claim is not supported. Cutting back on habits can still help."},

{id:"phone-free",name:"Phone free time and school phone bans",cat:"mind",v:"mixed",
 hook:"Lock the phone away to feel better and focus.",
 what:"Norwegian middle schools introduced smartphone bans at different times. A researcher at the Norwegian Institute of Public Health used that to study what happened. [[25]]",
 ev:["The study found that banning smartphones in middle schools had no average effect on education or mental health. [[25]]",
     "The averages hide a gender difference. Bans reduced psychological health care use among girls and improved girls' grades. [[25]]",
     "Bullying went down for both girls and boys. [[25]]"],
 watch:"The study covers middle schools and school wide rules. It says nothing about personal phone breaks at home. The paper first appeared in 2024. [[25,59]]",
 why:"Clear gains for some groups and no average effect overall."},

{id:"wellness-stacking",name:"Wellness stacking",cat:"mind",v:"mixed",
 hook:"Attach a healthy habit to one you already do.",
 what:"Wellness stacking pairs small healthy habits with daily routines. Examples are stretching while the kettle boils or taking vitamins after brushing your teeth. [[4]]",
 ev:["A therapist quoted by HealthyWomen says routines like this can reduce decision fatigue and make habits easier to keep. [[4]]",
     "She warns that stacking can turn into performative productivity, a way to push yourself into exhaustion. [[4]]",

{id:"japanese-walking",name:"Japanese walking method",cat:"move",v:"solid",
 hook:"Alternate fast and slow walking for a stronger heart.",
 what:"Also called interval walking. You alternate three minutes at a moderate pace with three minutes at a faster pace. It is named after a 2007 study from Japan. [[4]]",
 ev:["An exercise physiologist quoted by HealthyWomen says it builds cardiovascular endurance in less time and puts little strain on the body. [[4]]",
     "She says raising your heart rate for longer periods can lower blood pressure and may help with sleep, mood and mobility. [[4]]",
     "HealthyWomen rates it as a trend with substance. [[4]]"],
 watch:"This entry rests on one article. In the fast phase you walk quickly enough that talking becomes harder. [[4]]",
 why:"A low risk way to raise your heart rate, backed by an expert source."},

{id:"cold-sauna",name:"Cold plunges and saunas",cat:"move",v:"mixed",
 hook:"Ice baths and hot rooms for recovery, mood and immunity.",
 what:"A cold plunge is a short dip in very cold water. Saunas use heat. Both have spread from gyms and wellness resorts to social media. [[26,28]]",
 ev:["Harvard Health says the evidence for claimed benefits such as less stress, better sleep and stronger immunity is thin. [[26]]",
     "Cold plunges may ease muscle soreness after intense exercise, and they may reduce gains in muscle power and strength. [[26]]",
     "Cleveland Clinic says prolonged exposure can lead to hypothermia, so keep it short. [[27]]",
     "A Fortune report says research suggests benefits for adults, that teens' developing bodies are more vulnerable to extreme conditions, and that one expert saw no compelling evidence for detox claims. [[28]]"],
 watch:"Harvard Health says people with heart disease, especially heart rhythm problems, should avoid cold plunges. [[26]]",

{id:"strength",name:"Strength training for teens",cat:"move",v:"solid",
 hook:"Lifting is for everyone, including girls.",

 ev:["An Emory Healthcare article says research shows girls can do strength exercises as well as boys. [[29]]",
     "The article calls it a misconception that strength training means lifting heavy weights. [[29]]",
     "It says strength training can keep adolescents engaged in physical activity. [[29]]"],
 watch:"Start with good technique and get advice from a qualified coach or teacher.",
 why:"A specialist source supports it for girls and boys."},

{id:"creatine",name:"Creatine",cat:"move",v:"mixed",
 hook:"A powder for muscle that everyone seems to be taking.",
 what:"Creatine is a compound your body makes and that you also get from food. It is sold as a supplement. [[30]]",
 ev:["A University of Michigan study found that creatine use among US teens rose rapidly in recent years while steroid use fell. [[30]]",
     "The researchers suggest that the rise of gym influencers who promote supplements may be one reason. [[30]]",
     "A pediatrician told CTV he discourages teens from using it because studies on safety in young people are lacking. Another expert says it can be an effective tool alongside training and good nutrition. [[31]]"],
 watch:"The Michigan team warns that highly caffeinated pre workout mixes and energy drinks, which often go with creatine routines, can be harmful for teens. [[30]]",
 why:"Experts disagree on teen safety because long term studies in young people are lacking."},

{id:"dry-scooping",name:"Dry scooping",cat:"move",v:"risky",
 hook:"Eat pre workout powder straight from the scoop.",
 what:"Dry scooping means putting pre workout powder straight into your mouth without mixing it with liquid. The trend began with claims of faster absorption and more energy. [[32]]",
 ev:["The American Lung Association says dry scooping, mouth taping and putting garlic in the nose do not deliver their claims and can seriously risk your health. [[32]]",
     "A lung specialist quoted in the article says to use social media with extreme caution when you look for health information. [[32]]"],
 watch:"Follow the directions on the label and ask a pharmacist or doctor about any supplement. [[32]]",
 why:"A respiratory health charity warns of serious risk and finds no proven benefit."},

{id:"looksmaxxing",name:"Looksmaxxing",cat:"look",v:"risky",
 hook:"Optimize your face and body with a strict plan.",
 what:"Looksmaxxing is the idea that you can and should maximize your appearance. Mild versions include skincare and basic hygiene. Extreme versions use steroids, growth hormones, injectables or cosmetic surgery. [[33]]",
 ev:["Nationwide Children's Hospital says the hidden message is that appearance equals worth. This can lead to anxiety, shame, low self esteem and a distorted body image. [[33]]",
     "Routines can take over and leave less time for school, friends and fun. [[33]]",
     "Dr. Beresin, quoted by Michigan Public, reports a spike in worrying behavior among teen boys about their looks, including eating disorders and body dysmorphia. [[34]]"],
 watch:"Basics such as washing and sunscreen are fine. Extreme steps and constant self scrutiny are the warning signs. [[33]]",
 why:"Pediatric experts link the extreme version to anxiety, body image problems and eating disorders."},

{id:"skinnytok",name:"SkinnyTok",cat:"look",v:"risky",
 hook:"Tough love advice that treats thinness as the goal.",

 ev:["The Professional Association of Austrian Psychologists warns that this content can lead to obsessive calorie counting, excessive exercise and eating disorders such as anorexia, especially in teenagers. [[36]]",

     "Eating disorders are treatable illnesses, and getting help early matters. [[36]]"],

{id:"sephora-kids",name:"Sephora kids and tween skincare",cat:"look",v:"weak",

 ev:["A dermatologist at Thomas Jefferson University says products such as vitamin C and retinol are unnecessary for preteens. [[37]]",
     "Layering many products can cause irritation, flaking, redness and inflammation. [[37]]",
     "Gentle drugstore products are likely a better choice, and sunscreen is the most important proven product for preventing future skin damage. [[37]]",
     "A California lawmaker proposed a ban on selling some anti aging products, including retinol, to people under 18. [[38]]"],
 watch:"Keep your routine simple, and ask a doctor if you have acne.",
 why:"Dermatologists see little benefit and some risk of irritation."},

{id:"sunscreen",name:"Sunscreen skepticism and tanning",cat:"look",v:"risky",

 ev:["In the 2026 AAD survey, 52% of people believed at least one tanning myth, such as that tanning is safe if you do not burn. [[39]]",
     "19% believed a base tan can prevent sunburn or reduce cancer risk. The AAD says any tan is a sign of UV damage. [[39]]",
     "The president of the Skin Cancer Foundation says there is absolutely no evidence that sunscreen causes skin cancer. [[40]]",
     "The 2025 AAD survey reported that sunburn rates rose 40% and tanning rates rose 24% since 2020. [[40]]"],
 watch:"The AAD says at least 1 in 5 Americans will develop skin cancer in their lifetime. Use sunscreen and check your skin. [[39]]",
 why:"The claim is false and skipping sunscreen raises skin cancer risk."},

{id:"red-light",name:"Red light therapy",cat:"look",v:"mixed",

 ev:["A dermatologist quoted by HealthyWomen says red light can stimulate collagen and that most regular users notice better skin quality. [[4]]",
     "HealthyWomen rates under eye devices as a trend with substance, based on that expert view. [[4]]"],
 watch:"Devices vary and cost money. Look for more evidence before you buy.",

{id:"salmon-facial",name:"Salmon sperm facials",cat:"look",v:"weak",

 what:"The serum is made of sterilized DNA fragments extracted from salmon sperm cells. They are called polynucleotides, or PDRN. [[4]]",
 ev:["A dermatologist says it supports skin repair and collagen, as any skincare with peptides does. [[4]]",
     "A 2024 review found that polynucleotides helped with fine lines, elasticity and hydration. Results varied and research is limited. [[4]]",
     "Skincare is not regulated by the US Food and Drug Administration for safety and effectiveness. [[4]]"],
 watch:"The dermatologist's verdict is hype for now. [[4]]",
 why:"Research is limited and the expert quoted calls it hype for now."},

     "The same study says algorithms may normalize off label use, which raises concerns about misinformation and public health risks. [[41]]",
     "A University of Colorado researcher found that many websites selling compounded GLP-1 drugs claimed to be FDA approved or generic when they were not. [[42]]"],
 watch:"These are prescription medicines. Talk with a doctor, and be careful with online sellers. [[42]]",
 why:"Real medicines for medical conditions, surrounded by hype and risky sellers."},

{id:"peptides",name:"Peptides and BPC-157",cat:"tech",v:"risky",
 hook:"Injectable compounds for muscle, healing and youth.",
 what:"Influencers promote injectable compounds called peptides, such as BPC-157, for recovery, muscle growth and younger looking skin. They are unapproved drugs. [[44,45]]",
 ev:["A McMaster University researcher writes that published human evidence for BPC-157 is trivial. Feeling better after an injection can have other explanations, such as time, rehabilitation, expectation and regression to the mean. [[44]]",
     "Health Canada warned people not to buy or inject unauthorized peptide drugs sold online. [[44]]",
     "FDA scientists found little data on BPC-157 and raised concerns about contamination, allergic reactions and quality control. [[45]]",
     "An FDA advisory panel voted 8 to 6 in July 2026 in favor of broader access. The vote is not binding. [[45]]"],
 watch:"Influencers often earn money from what they promote, so check who profits. [[55]]",
 why:"Regulators raise safety concerns and human evidence is minimal."},

{id:"nicotine-pouches",name:"Nicotine pouches (Zyn)",cat:"tech",v:"risky",
 hook:"Tiny pouches for focus and confidence.",
 what:"Nicotine pouches are placed in the mouth. Influencers nicknamed Zynfluencers link them to confidence, masculinity and mental sharpness. [[46]]",
 ev:["In a 2024 US survey, 5.4% of teens said they had used nicotine pouches, up from 3.0% in 2023. [[46]]",
     "A UCSF article reports that use among youth and young adults nearly quadrupled between 2022 and 2025, according to a national study. [[47]]",
     "A different survey, the 2025 National Youth Tobacco Survey, found 1.7% of middle and high school students used pouches. About 90% of users chose flavored pouches. [[48]]",
     "Experts told PBS that nicotine exposure increases nicotine receptors in the brain, so people begin to need nicotine just to feel normal. [[48]]",
     "The FDA authorized Zyn for adults 21 and older. The pouches are not approved as a way to quit smoking. [[46,48]]",
     "A 2026 study of Zyn posts on Instagram and TikTok concluded that the content may appeal to youth. [[56]]"],
 watch:"The surveys measured different things, so the numbers differ. Both show that teens use these products. [[46,48]]",
 why:"Nicotine is addictive and the sources show growing use among young people."},

{id:"cgm",name:"Glucose monitors for healthy people",cat:"tech",v:"weak",
 hook:"Wear a sensor to see how food changes your blood sugar.",
 what:"Continuous glucose monitors are small patches that track blood sugar all day. They are lifesaving for people with diabetes and have become popular with people without it. [[49]]",
 ev:["An AP report says there is scant evidence that the monitors are useful for people with normal blood sugar. [[49]]",
     "Healthy bodies regulate glucose well after meals. Monitors may lead people to misread normal swings after eating or activity. [[49]]",
     "Even experts do not agree on how to interpret the data for people without diabetes. [[49]]"],
 watch:"Misreading normal swings is a known problem, according to the AP report. [[49]]",
 why:"The AP report finds little evidence of benefit for healthy people."},

{id:"ai-chatbots",name:"AI chatbots for health advice",cat:"tech",v:"mixed",
 hook:"Ask a chatbot about symptoms, stress or feelings.",

     "The researchers say the privacy that attracts teens also carries risk if they do not tell a health professional or trusted adult. [[50]]",
     "A pediatric psychologist told WPLG that newer chatbots are more unpredictable and more engaging, which increases risk. [[51]]",
     "A report on PhillyVoice says general purpose chatbots can give inaccurate or misleading advice with high confidence. [[52]]"],

var TMAP = {};
T.forEach(function(t){TMAP[t.id]=t;});

function idsIn(text){
  var out=[],re=/\[\[([\d,\s]+)\]\]/g,m;
  while((m=re.exec(text))){m[1].split(",").forEach(function(x){x=parseInt(x,10);if(x&&out.indexOf(x)<0)out.push(x);});}
  return out;
}
T.forEach(function(t){
  var all=[t.what].concat(t.ev,[t.watch]).join(" ");
  t.src=idsIn(all).sort(function(a,b){return a-b;});
});

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmt(s){
  return s.replace(/\s*\[\[([\d,\s]+)\]\]/g,function(m,ids){
    var links=ids.split(",").map(function(x){return parseInt(x,10);}).filter(Boolean).map(function(id){
      var sr=SRCMAP[id];
      return '<a class="ref" href="#/sources/'+id+'" title="'+esc(sr?sr.t:"Source")+'" aria-label="Source '+id+'">'+id+'</a>';
    }).join("");
    return '<sup class="refs">'+links+'</sup>';
  });
}
function stamp(v,big){
  return '<span class="stamp v-'+v+(big?' big':'')+'">'+ICON[v]+VERD[v].label+'</span>';
}
function plain(s){return s.replace(/\s*\[\[[\d,\s]+\]\]/g,"");}

function syncChips(){
  app.querySelectorAll("[data-cat]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-cat")===state.cat));});
  app.querySelectorAll("[data-v]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===state.v));});
}
function renderCards(){
  var q=state.q.trim().toLowerCase();
  var list=T.filter(function(t){
    if(state.cat!=="all"&&t.cat!==state.cat)return false;
    if(state.v!=="all"&&t.v!==state.v)return false;
    if(q){var hay=(t.name+" "+t.hook+" "+plain(t.what)+" "+CATS[t.cat].label).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  var ul=document.getElementById("cards");
  ul.innerHTML=list.map(function(t){
    return '<li class="cell" style="--cat:'+CATS[t.cat].color+'"><a class="card" href="#/trend/'+t.id+'">'+
      '<span class="card-top"><span class="cat-label">'+CATS[t.cat].label+'</span>'+stamp(t.v)+'</span>'+
      '<span class="card-name">'+esc(t.name)+'</span>'+
      '<span class="card-hook">'+esc(t.hook)+'</span>'+
      '<span class="card-foot">'+t.src.length+(t.src.length===1?' source':' sources')+', tap for the full check</span></a>'+
      '<div class="peek" aria-hidden="true">'+
        '<span class="peek-name">'+esc(t.name)+'</span>'+
        '<span class="peek-h">What it is</span><span class="peek-t">'+esc(plain(t.what))+'</span>'+
        '<span class="peek-h">Our verdict</span><span class="peek-v">'+stamp(t.v)+'</span><span class="peek-t">'+esc(t.why)+'</span>'+
        '<span class="peek-go">Click for the full check</span>'+
      '</div></li>';
  }).join("");
  if(!list.length)ul.innerHTML='<li class="empty">No trend matches. Try a different filter or search word.</li>';
  document.getElementById("count").textContent="Showing "+list.length+" of "+T.length;
}

function renderPitfalls(){
  var groups=PIT.map(function(g){
    var items=g.items.map(function(it){
      var seen=it.seen.map(function(id){return '<a href="#/trend/'+id+'">'+esc(TMAP[id].name)+'</a>';}).join("");

    }).join("");
    return '<section class="pgroup"><h2>'+esc(g.g)+'</h2><div class="pitems">'+items+'</div></section>';
  }).join("");
  var table=VORDER.map(function(v){
    var rows=T.filter(function(t){return t.v===v;}).map(function(t){
      return '<div class="row"><div class="nm"><a href="#/trend/'+t.id+'">'+esc(t.name)+'</a></div><div>'+stamp(t.v)+'</div><p>'+fmt(t.watch)+'</p></div>';
    }).join("");
    return '<h3 class="vh">'+VERD[v].label+' ('+T.filter(function(t){return t.v===v;}).length+' trends)</h3>'+rows;
  }).join("");
  var checks=CHECKS.map(function(c){return '<li><div><b>'+esc(c.b)+'</b>'+fmt(c.t)+'</div></li>';}).join("");
  app.innerHTML='<div class="wrap page">'+
    '<h1>When trend advice goes wrong</h1>'+
    '<p class="lead">Many trends start with a real wish, such as better sleep, more energy or clearer skin. The problems start when the advice is untested, sold to you or too extreme for a teenage body. This page explains the most common pitfalls and shows the main risk for each of the 30 trends.</p>'+
    groups+
    '<section class="pgroup"><h2>Trend by trend: the main pitfall</h2><div class="rows">'+table+'</div></section>'+
    '<section class="pgroup"><h2>Six questions to ask before you try a trend</h2><p class="fine" style="margin-top:0">This checklist is adapted from the advice in Harvard Health and the AP report, and from the patterns in the sources on this site.</p><ol class="checks">'+checks+'</ol></section>'+
    '<section class="callout" aria-labelledby="cw"><h2 id="cw">If something goes wrong</h2><p>Stop the trend. Tell a parent or another adult you trust. Talk to a doctor or to the school health nurse. In a medical emergency in Norway, call 113.</p></section>'+
  '</div>';
}

function renderSources(focusId){
  var groups=[{label:"Pitfalls and general advice",ids:[53,54,55,57]}];
  Object.keys(CATS).forEach(function(k){
    var ids=[];
    T.filter(function(t){return t.cat===k;}).forEach(function(t){t.src.forEach(function(i){if(ids.indexOf(i)<0)ids.push(i);});});
    groups.push({label:CATS[k].label,ids:ids});
  });
  var shown={};
  groups.forEach(function(g){g.ids=g.ids.filter(function(i){if(shown[i])return false;shown[i]=1;return true;});});
  var usedBy={};
  T.forEach(function(t){t.src.forEach(function(i){(usedBy[i]=usedBy[i]||[]).push(t);});});
  PIT.forEach(function(g){g.items.forEach(function(it){idsIn(it.p).forEach(function(i){usedBy[i]=usedBy[i]||[];});});});
  var html=groups.map(function(g){
    var items=g.ids.slice().sort(function(a,b){return a-b;}).map(function(id){
      var s=SRCMAP[id];
      var uses=(usedBy[id]||[]).map(function(t){return '<a href="#/trend/'+t.id+'">'+esc(t.name)+'</a>';}).join("");
      var date=s.d?esc(s.d):'date not shown';
      return '<li class="src" id="src-'+id+'"><span class="n">'+id+'</span><div>'+
        '<div class="t"><a href="'+esc(s.u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.t)+'</a></div>'+
        '<div class="m">'+esc(s.o)+', '+date+(s.d?'':'<span class="nd">check the date yourself</span>')+'</div>'+
        (uses?'<p class="u">Used for: '+uses+'</p>':'')+'</div></li>';
    }).join("");
    return '<section class="srcgroup"><h2>'+esc(g.label)+'</h2><ol class="srclist" style="list-style:none;padding:0">'+items+'</ol></section>';
  }).join("");
  app.innerHTML='<div class="wrap page">'+
    '<h1>Sources</h1>'+
    '<p class="lead">Every number and expert statement on this site comes from one of the '+SRC.length+' pages below. The small numbers in the text link here. The summaries use our own words.</p>'+
    '<section class="method" aria-labelledby="mh"><h2 id="mh" style="margin-top:16px">How the 30 trends were chosen, and the limits</h2><ul>'+
      '<li>No official ranking of the most popular health trends exists. These 30 appeared often in 2024 to 2026 coverage from hospitals, universities, health agencies and news outlets, and they matter to teenagers.</li>'+
      '<li>Almost every trend has at least one source with a confirmed publication date in 2024 or later. A few pages do not show a date. They are marked, and you should check them yourself before you rely on them.</li>'+
      '<li>Most sources come from the United States. A few come from Canada, Australia, Austria, the United Kingdom and Norway. Rules, products and numbers can differ in Norway.</li>'+
      '<li>Some entries rest on one article. They say so in the text.</li>'+
      '<li>Verdicts are a plain language reading of the sources. They are not medical advice, and experts can disagree.</li>'+
      '<li>Web pages change. Sources were last checked on 7 October 2026.</li>'+
    '</ul></section>'+
    html+'</div>';
  if(focusId){
    var el=document.getElementById("src-"+focusId);
    if(el){el.classList.add("hl");el.scrollIntoView({block:"center"});}
  }
}

/* ---------- dialog ---------- */
function openTrend(id){
  var t=TMAP[id];
  if(!t){go("/");return;}
  var seen=t.hook;
  var ev=t.ev.map(function(e){return '<li>'+fmt(e)+'</li>';}).join("");
  dlg.style.setProperty("--cat",CATS[t.cat].color);
  dlg.innerHTML='<div class="dlg-band"></div><div class="dlg-in">'+
    '<div class="dlg-head"><div><p class="dlg-cat">'+CATS[t.cat].label+'</p></div><button class="close" type="button" id="dlgClose">Close</button></div>'+
    '<h2 id="dlgTitle">'+esc(t.name)+'</h2>'+
    '<p>'+stamp(t.v,true)+'</p>'+
    '<p class="seen"><span>What you see online</span>'+esc(seen)+'</p>'+
    '<h3>What it is</h3><p>'+fmt(t.what)+'</p>'+
    '<h3>What the sources say</h3><ul>'+ev+'</ul>'+
    '<h3>Watch out for</h3><div class="watch"><p style="margin:0">'+fmt(t.watch)+'</p></div>'+
    '<h3>Why this verdict</h3><p>'+esc(t.why)+'</p>'+
    '<p class="fine">The verdict is our reading of the cited sources and is not medical advice. Numbers beside the text link to the sources page.</p>'+
  '</div>';
  document.getElementById("dlgClose").addEventListener("click",function(){dlg.close();});
  document.title=t.name+" | Hype Check";
  if(!dlg.open){lastFocus=document.activeElement;dlg.showModal();}
  dlg.scrollTop=0;
}
dlg.addEventListener("close",function(){
  if(cur.indexOf("/trend/")===0){
    cur="/";
    try{history.replaceState(null,"","#/");}catch(e){}
    document.title="Hype Check: 30 health trends from your feed";
    if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}
  }
});
dlg.addEventListener("click",function(e){
  if(e.target===dlg)dlg.close();
  var a=e.target.closest&&e.target.closest("a.ref");
  if(a){/* navigation handled by hashchange; dialog closes there */}
});

/* ---------- router ---------- */
var cur="";
function setNav(name){
  document.querySelectorAll("[data-nav]").forEach(function(a){
    if(a.getAttribute("data-nav")===name)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
}
function render(path){
  path=(path||"/").replace(/^#/,"");
  if(path.charAt(0)!=="/")path="/"+path;
  cur=path;
  var parts=path.slice(1).split("/");
  var name=parts[0]||"home";
  if(name==="trend"){
    if(view!=="home"){renderHome();view="home";setNav("home");}
    openTrend(parts[1]);
    return;
  }
  if(dlg.open){dlg.close();}
  if(name==="pitfalls"){renderPitfalls();view="pitfalls";setNav("pitfalls");document.title="Pitfalls | Hype Check";window.scrollTo(0,0);}
  else if(name==="sources"){renderSources(parts[1]);view="sources";setNav("sources");document.title="Sources | Hype Check";if(!parts[1])window.scrollTo(0,0);}
  else{
    if(view!=="home"){renderHome();view="home";window.scrollTo(0,0);}
    setNav("home");document.title="Hype Check: 30 health trends from your feed";
  }
}
function go(path){
  try{history.pushState(null,"","#"+path);}catch(e){}
  render(path);
}
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#/"]');
  if(!a)return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return;
  e.preventDefault();
  go(a.getAttribute("href").slice(1));
});
function fromHash(){
  var h=location.hash.replace(/^#/,"");
  if(h===cur)return;
  render(h||"/");
}
window.addEventListener("hashchange",fromHash);
window.addEventListener("popstate",fromHash);

/* ---------- theme ---------- */
var btn=document.getElementById("themeBtn");
function currentTheme(){
  var set=document.documentElement.getAttribute("data-theme");
  if(set)return set;
  return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
}
function syncBtn(){btn.setAttribute("aria-pressed",String(currentTheme()==="dark"));}
btn.addEventListener("click",function(){
  var next=currentTheme()==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("hc-theme",next);}catch(e){}
  syncBtn();
});
try{var saved=localStorage.getItem("hc-theme");if(saved==="dark"||saved==="light")document.documentElement.setAttribute("data-theme",saved);}catch(e){}
syncBtn();

render(location.hash.replace(/^#/,"")||"/");
})();
</script>
</body>
</html>
